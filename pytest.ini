[pytest]
# Test discovery
testpaths = Tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    online: tests that require internet access
    slow: tests that take significant time to run
    external_tool: tests that require external command-line tools (DSSP, NACCESS, etc.)
    numpy: tests that require NumPy
    scipy: tests that require SciPy
    matplotlib: tests that require matplotlib
    networkx: tests that require networkx
    igraph: tests that require igraph
    rdflib: tests that require rdflib
    reportlab: tests that require reportlab
    mmtf: tests that require mmtf-python
    mysql: tests that require MySQL database
    sqlite: tests that require sqlite3
    dssp: tests that require DSSP tool
    naccess: tests that require NACCESS tool
    psea: tests that require PSEA tool
    emboss: tests that require EMBOSS suite
    clustalw: tests that require ClustalW

# Output configuration
console_output_style = progress
addopts =
    --strict-markers
    --tb=short
    -v

# Doctest configuration
doctest_optionflags = ELLIPSIS NORMALIZE_WHITESPACE
# Note: We handle doctest discovery manually via conftest.py due to complex exclusion logic

# Warnings
filterwarnings =
    default::Bio.BiopythonWarning
    default::Bio.BiopythonDeprecationWarning
    default::Bio.BiopythonExperimentalWarning
